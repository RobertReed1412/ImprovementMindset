# Read by agent-hq/plugins/dev/scripts/ios-test.sh (agent test runner).
SIM=86A0E9EB-CD63-440D-B333-A22042B6C48A          # iPhone 17 Pro
UNIT=(ImprovementMindsetTests)
UI=(ImprovementMindsetUITests)
# Xcode template tests: slow (launch perf x5, screenshot per appearance) and not testing features.
SKIP=(ImprovementMindsetUITests/ImprovementMindsetUITestsLaunchTests
      ImprovementMindsetUITests/ImprovementMindsetUITests/testLaunchPerformance)
# UI_SHARDS is picked from RAM (1 on this 8 GB Mac; measured: 2 sims was slower).
UI_RETRIES=2
# Fresh notification permission per sim (the permission-flow UI test needs it).
BEFORE_UI='xcrun simctl privacy $SIM reset all com.robertreed.improvementmindset'
